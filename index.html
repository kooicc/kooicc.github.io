<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BI4BOB 业余无线电台 QSL卡片查询">
  <meta name="theme-color" content="#031428">
  <title>BI4BOB业余无线电台</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ffffff'/><circle cx='50' cy='50' r='42' fill='none' stroke='%231e66d0' stroke-width='4'/><path d='M50 15 L25 75 L75 75 Z' fill='none' stroke='%231e66d0' stroke-width='4' stroke-linejoin='round'/><path d='M50 25 L50 40' stroke='%231e66d0' stroke-width='4'/><path d='M43 30 L57 30' stroke='%231e66d0' stroke-width='3'/><path d='M50 40 C 40 45, 60 55, 50 60' fill='none' stroke='%231e66d0' stroke-width='3'/><circle cx='50' cy='50' r='12' fill='%23ffffff' stroke='%231e66d0' stroke-width='3'/><path d='M40 52 Q 50 42 62 50' fill='none' stroke='%23e63946' stroke-width='3' stroke-linecap='round'/><rect x='32' y='60' width='36' height='10' rx='4' fill='%23ffffff' stroke='%231e66d0' stroke-width='2'/><text x='50' y='68' font-family='Arial, sans-serif' font-size='8' font-weight='bold' fill='%231e66d0' text-anchor='middle'>CRAC</text><path d='M40 75 L40 85 M50 75 L50 85 M60 75 L60 85' stroke='%231e66d0' stroke-width='3'/></svg>" type="image/svg+xml">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="aurora aurora-one"></div>
    <div class="aurora aurora-two"></div>
    <div class="grid-horizon"></div>
  </div>

  <main class="app-shell">
    <header class="hero">
      <div class="hero-title">
        <h1>
          <img src="CRAC.png" alt="CRAC" class="crac-logo">
          <span class="title-text">
            中华人民共和国个人业余无线电台
            <small>PERSONAL AMATEUR RADIO STATION OF P.R.CHINA</small>
          </span>
        </h1>
      </div>
    </header>

    <section class="log-panel" aria-labelledby="tabQso">
      <div class="panel-head">
        <div class="panel-head-left">
          <div class="title-row">
            <!-- 左边卡片墙，右边收发记录 -->
            <button id="tabQsl" class="title-log" type="button">
              🖼️ QSL卡片
            </button>
            <button id="tabQso" class="title-log" type="button">
              <span class="btn-icon" aria-hidden="true">▼</span>
              📋 QSL收发
            </button>
          </div>
        </div>

        <div id="searchContainer" class="panel-head-actions hidden">
          <label class="search-box" for="callsignSearch">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
            <input id="callsignSearch" type="search" placeholder="搜索呼号、频率、模式、位置等" autocomplete="off">
            <kbd>SEARCH</kbd>
          </label>
        </div>
      </div>

      <!-- 外层折叠容器 -->
      <div id="logContainer" class="log-container collapsed">
        
        <!-- QSL 卡片墙 -->
        <div id="qslContent" class="wall-container hidden">
          <div id="wallGrid" class="wall-grid">
            <!-- 图片由 JS 自动渲染到这里 -->
          </div>
        </div>

        <!-- QSO 收发记录 -->
        <div id="qsoContent" class="table-wrapper hidden">
          <div class="table-frame">
            <table>
              <thead>
                <tr>
                  <th>通联时间 <small>DATE / TIME (UTC)</small></th>
                  <th>呼号 <small>CALLSIGN</small></th>
                  <th>频率 <small>FREQ (MHz)</small></th>
                  <th>模式 <small>MODE</small></th>
                  <th>信号 <small>RST</small></th>
                  <th>位置 <small>QTH</small></th>
                  <th>QSL收到时间 <small>Roger BJT(UTC+8)</small></th>
                  <th>QSL寄出时间 <small>Sent BJT(UTC+8)</small></th>
                </tr>
              </thead>
              <tbody id="logBody"></tbody>
            </table>
            <div id="emptyState" class="empty-state" hidden>
              <span>⌁</span>
              <strong>未找到匹配的记录</strong>
              <small>请尝试输入其他关键字</small>
            </div>
          </div>

          <div class="panel-footer">
            <p>已显示 <strong id="rangeInfo">0–0</strong> 条，共 <strong id="totalInfo">0</strong> 条记录</p>
            <nav class="pagination" aria-label="通联日志分页">
              <button id="prevBtn" type="button" aria-label="上一页">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                上一页
              </button>
              <span id="pageInfo">01 / 01</span>
              <button id="nextBtn" type="button" aria-label="下一页">
                下一页
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
              </button>
            </nav>
          </div>
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <div class="footer-line-1">
        <span>Copyright © 1996-2026 </span>
        <a href="https://github.com/kooicc/kooicc.github.io" target="_blank" rel="noopener noreferrer">BI4BOB</a>
        <span class="footer-emoji">🏃‍♂️</span>
      </div>
      <div class="footer-line-2">
        <span class="footer-separator pc-sep">|</span>
        <a href="https://www.qrz.com/db/BI4BOB" target="_blank" rel="noopener noreferrer">QRZ</a>
        <span class="footer-separator">|</span>
        <a href="https://www.shanghai.gov.cn/nw2318/index.html" target="_blank" rel="noopener noreferrer">QTH: Shanghai China</a>
        <span class="footer-separator">|</span>
        <a href="https://aprs.fi/#!call=BI4BOB-10" target="_blank" rel="noopener noreferrer">APRS</a>
        <span class="footer-dot"></span>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
  
  <script>
    const tabQso = document.getElementById("tabQso");
    const tabQsl = document.getElementById("tabQsl");
    const qsoContent = document.getElementById("qsoContent"); 
    const qslContent = document.getElementById("qslContent"); 
    const logContainer = document.getElementById("logContainer"); 
    const searchContainer = document.getElementById("searchContainer");
    const wallGrid = document.getElementById("wallGrid");
    const tabQsoIcon = tabQso.querySelector(".btn-icon");

    // 默认收起状态
    let isExpanded = false; 
    // 当前在哪个标签
    let currentTab = ''; 

    // 你的 Cloudflare 图床链接
    const qslImages = [
      "https://img.244056614.xyz/BH3NZN.jpg",
      "https://img.244056614.xyz/BI4AJF.jpg",
      "https://img.244056614.xyz/BG3NQT.jpg",
      "https://img.244056614.xyz/BH8GTW.jpg",
      "https://img.244056614.xyz/BH4GWF.jpg",
      "https://img.244056614.xyz/BI4BRD.jpg",
    ];

    function renderWall() {
      if (wallGrid.innerHTML !== "") return;
      qslImages.forEach(url => {
        const div = document.createElement("div");
        div.className = "wall-item";
        div.innerHTML = `<img src="${url}" alt="QSL Card" loading="lazy">`;
        wallGrid.appendChild(div);
      });
    }

    function switchTab(tabName) {
      if (currentTab === tabName) {
        // 如果点击的是当前已激活的标签，则切换折叠状态
        isExpanded = !isExpanded;
      } else {
        // 如果点击的是另一个标签，切换到该标签并自动展开
        currentTab = tabName;
        isExpanded = true;
        
        // 更新按钮的高亮样式
        tabQso.classList.toggle("active", tabName === 'qso');
        tabQsl.classList.toggle("active", tabName === 'qsl');

        // 切换显示的内容区
        if (tabName === 'qso') {
          qsoContent.classList.remove("hidden");
          qslContent.classList.add("hidden");
        } else {
          qslContent.classList.remove("hidden");
          qsoContent.classList.add("hidden");
          renderWall();
        }
      }

      // 处理折叠动画和搜索框显隐
      if (isExpanded) {
        logContainer.classList.remove("collapsed");
        // 如果是表格就显示搜索框，否则隐藏
        searchContainer.classList.toggle("hidden", currentTab !== 'qso');
      } else {
        logContainer.classList.add("collapsed");
        searchContainer.classList.add("hidden");
      }
    }

    tabQsl.addEventListener("click", () => switchTab('qsl'));
    tabQso.addEventListener("click", () => switchTab('qso'));

    // 监听折叠状态，更新箭头方向
    const observer = new MutationObserver(() => {
      if (logContainer.classList.contains("collapsed")) {
        tabQsoIcon.textContent = '▼';
      } else {
        tabQsoIcon.textContent = '▲';
      }
    });
    observer.observe(logContainer, { attributes: true, attributeFilter: ['class'] });
  </script>
</body>
</html>
